name: Build Windows exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=5.13,<6.10"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check the GUI starts
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import sys; from PyQt5.QtWidgets import QApplication; app = QApplication(sys.argv); from data_arranger.gui.main_window import MainWindow; w = MainWindow(); w.show(); app.processEvents(); print('GUI OK')"

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --windowed --name DataArranger
          --collect-data langdetect --collect-submodules hachoir run.py

      - uses: actions/upload-artifact@v4
        with:
          name: DataArranger-windows
          path: dist/DataArranger/
