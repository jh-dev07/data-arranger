name: Build Windows exe

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Portable llama.cpp build: runs on any x86-64 CPU with AVX2 (2013+).
  CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_AVX512=OFF -DLLAMA_CURL=OFF"
  FORCE_CMAKE: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-qwen25-1p5b-q4km-lid176-v1

      - name: Download models
        run: python download_models.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel "setuptools<70"
          pip install -r requirements.txt "pyinstaller>=5.13,<6.10" "setuptools<70"
          pip list

      - name: Bundle helper tools (7-Zip for CHM, DjVuLibre for DjVu)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools\7z, tools\djvulibre | Out-Null
          Copy-Item "C:\Program Files\7-Zip\7z.exe", "C:\Program Files\7-Zip\7z.dll" tools\7z\
          $url = "https://sourceforge.net/projects/djvu/files/DjVuLibre_Windows/3.5.28%2B4.12/DjVuLibre-3.5.28_DjView-4.12_Setup.exe/download"
          Invoke-WebRequest -Uri $url -OutFile djvu_setup.exe -UserAgent "Wget" -MaximumRedirection 10
          & "C:\Program Files\7-Zip\7z.exe" x djvu_setup.exe -odjvu_x -y | Out-Null
          $exe = Get-ChildItem djvu_x -Recurse -Filter ddjvu.exe | Select-Object -First 1
          if (-not $exe) { throw "ddjvu.exe not found in DjVuLibre installer" }
          $dir = $exe.DirectoryName
          Copy-Item "$dir\*.dll" tools\djvulibre\
          foreach ($t in "ddjvu.exe","djvused.exe","djvutxt.exe") { Copy-Item "$dir\$t" tools\djvulibre\ }
          Get-ChildItem tools -Recurse | Select-Object FullName, Length

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Full pipeline test (OCR + ML model, from source)
        env:
          DATA_ARRANGER_FULL: "1"
        run: python -m unittest tests.test_full -v

      - name: GUI starts
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import sys; from PyQt5.QtWidgets import QApplication; app = QApplication(sys.argv); from data_arranger.gui.main_window import MainWindow; w = MainWindow(); w.show(); app.processEvents(); print('GUI OK', w.caps.text())"

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --windowed --name DataArranger
          --collect-all rapidocr_onnxruntime --collect-all llama_cpp
          --collect-binaries onnxruntime --collect-data langdetect
          --collect-submodules hachoir run.py

      - name: Add models and tools to the app folder
        shell: pwsh
        run: |
          Copy-Item -Recurse models dist\DataArranger\models
          Copy-Item -Recurse tools dist\DataArranger\tools
          Copy-Item README.md dist\DataArranger\
          # PyQt5 ships an old MSVC C++ runtime; llama.cpp (built with VS 2022)
          # crashes with it (access violation in std::mutex). Replace every bundled
          # copy with the current, backward-compatible runtime from Windows.
          $names = "msvcp140.dll","msvcp140_1.dll","msvcp140_2.dll","msvcp140_atomic_wait.dll","msvcp140_codecvt_ids.dll","vcruntime140.dll","vcruntime140_1.dll","concrt140.dll","vcomp140.dll"
          Write-Host "Before:"
          Get-ChildItem dist\DataArranger\_internal -Recurse -Include $names | ForEach-Object { "{0}  {1}" -f $_.FullName, $_.VersionInfo.FileVersion }
          Get-ChildItem dist\DataArranger\_internal -Recurse -Include $names | ForEach-Object {
            $src = Join-Path $env:WINDIR ("System32\" + $_.Name)
            if (Test-Path $src) { Copy-Item $src $_.FullName -Force }
          }
          foreach ($n in $names) {
            $dst = "dist\DataArranger\_internal\$n"; $src = Join-Path $env:WINDIR "System32\$n"
            if ((Test-Path $src) -and -not (Test-Path $dst)) { Copy-Item $src $dst }
          }
          Write-Host "After:"
          Get-ChildItem dist\DataArranger\_internal -Recurse -Include $names | ForEach-Object { "{0}  {1}" -f $_.FullName, $_.VersionInfo.FileVersion }

      - name: Diagnose llama.cpp loading (source vs packaged)
        if: always()
        shell: pwsh
        timeout-minutes: 10
        run: |
          python -m data_arranger --diag-llm diag_src.txt
          Write-Host "===== from source ====="; Get-Content diag_src.txt -Encoding UTF8
          $p = Start-Process -FilePath dist\DataArranger\DataArranger.exe -ArgumentList "--diag-llm", "$PWD\diag_exe.txt" -PassThru
          $p | Wait-Process -Timeout 300 -ErrorAction SilentlyContinue
          Write-Host "===== packaged exe ====="; if (Test-Path diag_exe.txt) { Get-Content diag_exe.txt -Encoding UTF8 }

      - name: Self-test the built exe
        shell: pwsh
        timeout-minutes: 25
        run: |
          $log = Join-Path $env:TEMP "DataArranger\app.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Resolve-Path dist\DataArranger\DataArranger.exe).Path
          $psi.Arguments = "--selftest `"$PWD\selftest_exe.json`""
          $psi.UseShellExecute = $false
          $p = [System.Diagnostics.Process]::Start($psi)
          $finished = $p.WaitForExit(20 * 60 * 1000)
          if (-not $finished) { & taskkill /T /F /PID $p.Id | Out-Null }
          Write-Host "===== self-test report ====="
          if (Test-Path selftest_exe.json) { Get-Content selftest_exe.json -Encoding UTF8 }
          Write-Host "===== app.log ====="
          if (Test-Path $log) { Get-Content $log -Encoding UTF8 -Tail 200 }
          Get-Process DataArranger -ErrorAction SilentlyContinue | Select-Object Id, StartTime, CPU
          if (-not $finished) { throw "self-test of the built exe timed out" }
          if ($p.ExitCode -ne 0) { throw "self-test of the built exe failed (exit $($p.ExitCode))" }

      - name: Package
        shell: pwsh
        run: |
          & "C:\Program Files\7-Zip\7z.exe" a -tzip -mx=5 DataArranger-windows.zip .\dist\DataArranger | Out-Null
          Get-Item DataArranger-windows.zip | Select-Object Name, Length

      - name: Publish release (latest build)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "latest-build"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease --title "Latest Windows build" --notes "Built from $env:GITHUB_SHA. Unzip and run DataArranger\DataArranger.exe."
          } else {
            gh release edit $tag --notes "Built from $env:GITHUB_SHA. Unzip and run DataArranger\DataArranger.exe."
          }
          gh release upload $tag DataArranger-windows.zip --clobber

      - name: Keep self-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-reports
          path: |
            selftest_exe.json
            ${{ runner.temp }}/DataArranger/app.log
          if-no-files-found: ignore
